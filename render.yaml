services:
  - type: web
    name: nifty-price-action-engine
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    disk:
      name: nifty-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SECURITY_ID
        value: "13"
      - key: EXCHANGE_SEGMENT
        value: IDX_I
      - key: INSTRUMENT
        value: INDEX
  - type: worker
    name: nifty-price-action-alert-worker
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python alert_worker.py
    disk:
      name: nifty-alert-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SECURITY_ID
        value: "13"
      - key: EXCHANGE_SEGMENT
        value: IDX_I
      - key: INSTRUMENT
        value: INDEX
      - key: POLL_SECONDS
        value: "60"
      - key: LIVE_STOP_POINTS
        value: "30"
      - key: LIVE_TARGET_POINTS
        value: "60"
      - key: LIVE_SLIPPAGE_POINTS
        value: "1"
